<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Endless Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; top: 0; left: 0; width: 100%; pointer-events: none;
    display: flex; justify-content: space-between; padding: 18px 28px; }
  #score-box { background: rgba(0,0,0,0.45); border: 1px solid rgba(0,200,255,0.3);
    border-radius: 12px; padding: 10px 22px; backdrop-filter: blur(6px); }
  #score-label { color: rgba(0,200,255,0.7); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
  #score { color: #fff; font-size: 32px; font-weight: 700; }
  #hi-label { color: rgba(255,200,0,0.7); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
  #hi { color: #ffd700; font-size: 18px; font-weight: 600; }
  #lives { background: rgba(0,0,0,0.45); border: 1px solid rgba(255,100,100,0.3);
    border-radius: 12px; padding: 10px 22px; backdrop-filter: blur(6px); text-align: right; }
  #lives-label { color: rgba(255,100,100,0.7); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
  #hearts { color: #ff4466; font-size: 22px; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,20,0.82); backdrop-filter: blur(4px); transition: opacity 0.4s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { color: #00c8ff; font-size: 52px; font-weight: 800; margin-bottom: 8px;
    text-shadow: 0 0 30px #00c8ff88; }
  #overlay .sub { color: #aaa; font-size: 16px; margin-bottom: 36px; }
  #overlay .hint { color: #ccc; font-size: 14px; margin-top: 14px; }
  #play-btn { background: linear-gradient(135deg, #00c8ff, #0055ff); color: #fff;
    border: none; border-radius: 50px; padding: 16px 48px; font-size: 20px; font-weight: 700;
    cursor: pointer; pointer-events: all; box-shadow: 0 0 30px #00c8ff55;
    transition: transform 0.15s; }
  #play-btn:hover { transform: scale(1.07); }
  #gameover { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,20,0.88); backdrop-filter: blur(6px); transition: opacity 0.4s; }
  #gameover.hidden { opacity: 0; pointer-events: none; }
  #gameover h1 { color: #ff4466; font-size: 56px; font-weight: 800;
    text-shadow: 0 0 30px #ff446688; margin-bottom: 6px; }
  #gameover .final { color: #fff; font-size: 22px; margin-bottom: 4px; }
  #gameover .best  { color: #ffd700; font-size: 16px; margin-bottom: 36px; }
  #restart-btn { background: linear-gradient(135deg, #ff4466, #ff8800); color: #fff;
    border: none; border-radius: 50px; padding: 14px 44px; font-size: 18px; font-weight: 700;
    cursor: pointer; pointer-events: all; transition: transform 0.15s; }
  #restart-btn:hover { transform: scale(1.07); }
  #speed-bar-wrap { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 30px; padding: 8px 18px; backdrop-filter: blur(4px); pointer-events: none; }
  #speed-bar-wrap span { color: rgba(255,255,255,0.5); font-size: 11px; text-transform: uppercase; }
  #speed-bar-bg { width: 120px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  #speed-bar { height: 100%; width: 10%; background: linear-gradient(90deg, #00c8ff, #ff4466);
    border-radius: 3px; transition: width 0.3s; }
  #hint { position: fixed; bottom: 58px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.3); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="ui">
  <div id="score-box">
    <div id="score-label">Score</div><div id="score">0</div>
    <div id="hi-label">Best</div><div id="hi">0</div>
  </div>
  <div id="lives">
    <div id="lives-label">Lives</div><div id="hearts">❤️❤️❤️</div>
  </div>
</div>
<div id="speed-bar-wrap"><span>Speed</span><div id="speed-bar-bg"><div id="speed-bar"></div></div></div>
<div id="hint">← → / A D to switch lanes  |  Space / ↑ to jump (double-jump!)</div>
<div id="overlay">
  <h1>🌊 Endless Runner</h1>
  <div class="sub">Dodge the blocks. Collect coins. Survive.</div>
  <button id="play-btn">▶ START</button>
  <div class="hint">← → or A D  |  Space / ↑ to jump</div>
</div>
<div id="gameover" class="hidden">
  <h1>💀 Game Over</h1>
  <div class="final" id="final-score">Score: 0</div>
  <div class="best" id="final-best">Best: 0</div>
  <button id="restart-btn">🔄 Try Again</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
const LANES=[-2.4,0,2.4],GRAVITY=-28,JUMP_VEL=12,TILE_LEN=10,TILE_COUNT=18;
const OBS=['wall','low','slide'],BASE=12,MAX=38;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a1a);
scene.fog=new THREE.FogExp2(0x0a0a1a,0.028);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,200);
cam.position.set(0,3.5,7);cam.lookAt(0,1,-4);
scene.add(new THREE.AmbientLight(0x223366,0.8));
const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(5,12,8);dl.castShadow=true;
dl.shadow.mapSize.set(1024,1024);dl.shadow.camera.left=dl.shadow.camera.bottom=-20;
dl.shadow.camera.right=dl.shadow.camera.top=20;scene.add(dl);
const nL=new THREE.PointLight(0x00c8ff,2,20);nL.position.set(-4,2,0);scene.add(nL);
const nR=new THREE.PointLight(0xff4466,2,20);nR.position.set(4,2,0);scene.add(nR);
const M=(c,e,i=0.4)=>new THREE.MeshStandardMaterial({color:c,emissive:e,emissiveIntensity:i,roughness:0.4,metalness:0.6});
const trackM=new THREE.MeshStandardMaterial({color:0x111133,roughness:0.9,metalness:0.1,emissive:0x050520});
const lineM=M(0x00c8ff,0x00c8ff,0.6),wallM=M(0xff3355,0xff1133),lowM=M(0xffaa00,0xff8800);
const slideM=M(0xaa00ff,0x8800ff),sideM=M(0x223366,0x001144,0.5);
const playerM=new THREE.MeshStandardMaterial({color:0x00c8ff,emissive:0x0088cc,emissiveIntensity:0.5,roughness:0.3,metalness:0.8});
const visorM=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x88ffff,emissiveIntensity:0.8,roughness:0.1,metalness:1});
const coinM=new THREE.MeshStandardMaterial({color:0xffd700,emissive:0xffaa00,emissiveIntensity:0.7,roughness:0.2,metalness:1});
const tiles=[];
function mkTile(z){
  const g=new THREE.Group();
  const r=new THREE.Mesh(new THREE.BoxGeometry(6.5,0.3,TILE_LEN),trackM);r.position.y=-0.15;r.receiveShadow=true;g.add(r);
  for(let i=-1;i<=1;i++){const l=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.32,TILE_LEN*0.6),lineM);l.position.set(i*2.4,0.01,0);g.add(l);}
  [-3.5,3.5].forEach(x=>{const w=new THREE.Mesh(new THREE.BoxGeometry(0.4,1.2,TILE_LEN),sideM);w.position.set(x,0.6,0);w.castShadow=true;g.add(w);});
  g.position.z=z;scene.add(g);tiles.push(g);
}
const pg=new THREE.Group();scene.add(pg);
const body=new THREE.Mesh(new THREE.BoxGeometry(0.7,1,0.5),playerM);body.position.y=0.5;body.castShadow=true;pg.add(body);
const head=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.55,0.5),playerM);head.position.y=1.28;head.castShadow=true;pg.add(head);
const visor=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.18,0.1),visorM);visor.position.set(0,1.28,0.26);pg.add(visor);
[-0.18,0.18].forEach(x=>{const l=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.55,0.3),playerM);l.position.set(x,-0.1,0);l.castShadow=true;pg.add(l);});
[-0.5,0.5].forEach(x=>{const a=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.6,0.22),playerM);a.position.set(x,0.5,0);a.castShadow=true;pg.add(a);});
pg.position.set(0,0,2);
const sg=new THREE.BufferGeometry(),sp=[];
for(let i=0;i<1200;i++)sp.push((Math.random()-.5)*200,Math.random()*40+2,(Math.random()-.5)*200);
sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.18,sizeAttenuation:true})));
const obs=[],coins=[];
function spawnObs(z){
  const lc=[0,1,2].sort(()=>Math.random()-.5).slice(0,Math.random()<.35?2:1);
  const type=OBS[Math.floor(Math.random()*3)];
  lc.forEach(li=>{
    const lx=LANES[li];let m;
    if(type==='wall'){m=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.5,0.7),wallM);m.position.set(lx,.75,z);m._h=1.5;}
    else if(type==='low'){m=new THREE.Mesh(new THREE.BoxGeometry(1.6,.55,.7),lowM);m.position.set(lx,.275,z);m._h=.55;}
    else{m=new THREE.Mesh(new THREE.BoxGeometry(.5,2.2,.5),slideM);m.position.set(lx,1.1,z);m._h=2.2;}
    m.castShadow=true;scene.add(m);obs.push(m);
  });
}
function spawnCoins(z){
  if(Math.random()<.5)return;
  const lx=LANES[Math.floor(Math.random()*3)];
  for(let i=0;i<4;i++){const c=new THREE.Mesh(new THREE.TorusGeometry(.22,.07,8,16),coinM);c.position.set(lx,.9,z-i*1.2);c.rotation.x=Math.PI/2;c._c=false;scene.add(c);coins.push(c);}
}
let state='start',score=0,hi=0,lives=3,speed=BASE,st=0,ct=0,inv=0,lane=1,tx=LANES[1],vy=0,py=0,jumps=0,T=0;
const keys={};
window.addEventListener('keydown',e=>{if(keys[e.code])return;keys[e.code]=true;if(state!=='playing')return;if(e.code==='ArrowLeft'||e.code==='KeyA')ml(-1);if(e.code==='ArrowRight'||e.code==='KeyD')ml(1);if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
let sx=0,sy=0;
window.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',e=>{if(state!=='playing')return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(dx<-30)ml(-1);if(dx>30)ml(1);}else{if(dy<-30)jump();}},{passive:true});
function ml(d){const n=lane+d;if(n<0||n>2)return;lane=n;tx=LANES[lane];}
function jump(){if(jumps<2){vy=JUMP_VEL;jumps++;}}
const $s=document.getElementById('score'),$h=document.getElementById('hi');
const $ht=document.getElementById('hearts'),$sb=document.getElementById('speed-bar');
const $ov=document.getElementById('overlay'),$go=document.getElementById('gameover');
const $fs=document.getElementById('final-score'),$fb=document.getElementById('final-best');
document.getElementById('play-btn').addEventListener('click',start);
document.getElementById('restart-btn').addEventListener('click',start);
function ui(){
  $s.textContent=Math.floor(score);$h.textContent=Math.floor(hi);
  $ht.textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));
  $sb.style.width=Math.max(8,Math.min(100,((speed-BASE)/(MAX-BASE))*100))+'%';
}
function start(){
  score=0;lives=3;speed=BASE;st=0;ct=0;inv=0;lane=1;tx=LANES[1];vy=0;py=0;jumps=0;T=0;
  obs.forEach(o=>scene.remove(o));obs.length=0;coins.forEach(c=>scene.remove(c));coins.length=0;
  tiles.forEach(t=>scene.remove(t));tiles.length=0;
  for(let i=0;i<TILE_COUNT;i++)mkTile(-i*TILE_LEN+10);
  pg.position.set(LANES[1],0,2);$ov.classList.add('hidden');$go.classList.add('hidden');state='playing';ui();
}
function die(){lives--;ui();if(lives<=0){state='dead';if(score>hi)hi=score;$fs.textContent='Score: '+Math.floor(score);$fb.textContent='Best: '+Math.floor(hi);$go.classList.remove('hidden');}else inv=2;}
function col(){
  const px=pg.position.x,pz=pg.position.z;
  for(let i=obs.length-1;i>=0;i--){const o=obs[i];if(Math.abs(px-o.position.x)<1.15&&Math.abs(pz-o.position.z)<.9&&py<o._h&&py+1.6>0){if(inv<=0)die();return;}}
  for(let i=coins.length-1;i>=0;i--){const c=coins[i];if(c._c)continue;if(Math.abs(px-c.position.x)<.6&&Math.abs(pz-c.position.z)<.6&&Math.abs(py+.9-c.position.y)<.5){c._c=true;c.visible=false;score+=5;}}
}
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(state!=='playing'){renderer.render(scene,cam);return;}
  T+=dt;inv=Math.max(0,inv-dt);
  speed=Math.min(MAX,BASE+score*.003+T*.05);score+=dt*(speed/BASE)*2;if(score>hi)hi=score;
  tiles.forEach(t=>{t.position.z+=speed*dt;if(t.position.z>cam.position.z+TILE_LEN)t.position.z-=TILE_COUNT*TILE_LEN;});
  for(let i=obs.length-1;i>=0;i--){obs[i].position.z+=speed*dt;if(obs[i].position.z>cam.position.z+8){scene.remove(obs[i]);obs.splice(i,1);}}
  for(let i=coins.length-1;i>=0;i--){coins[i].position.z+=speed*dt;coins[i].rotation.z+=dt*3;if(coins[i].position.z>cam.position.z+8){scene.remove(coins[i]);coins.splice(i,1);}}
  st-=dt;if(st<=0){st=Math.max(.8,2-score*.001)+Math.random()*.5;spawnObs(-60);}
  ct-=dt;if(ct<=0){ct=3+Math.random()*2;spawnCoins(-65);}
  pg.position.x+=(tx-pg.position.x)*Math.min(1,12*dt);
  vy+=GRAVITY*dt;py+=vy*dt;if(py<=0){py=0;vy=0;jumps=0;}
  pg.position.y=py;pg.rotation.z=-(tx-pg.position.x)*.15;
  pg.rotation.x=py>.05?(vy>0?-.15:.1):0;
  if(py<=.05)body.position.y=.5+Math.sin(T*12)*.04;
  pg.visible=inv<=0||Math.sin(T*30)>0;
  col();
  nL.intensity=1.8+Math.sin(T*2.1)*.4;nR.intensity=1.8+Math.sin(T*1.7+1)*.4;
  cam.position.x=Math.sin(T*.4)*.15;
  ui();renderer.render(scene,cam);
}
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
requestAnimationFrame(loop);
</script>
</body>
</html>
