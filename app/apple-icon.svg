<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="40" y1="0" x2="472" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c8b4ff"/>
      <stop offset="0.55" stop-color="#f6a9d6"/>
      <stop offset="1" stop-color="#ffc9a3"/>
    </linearGradient>
    <linearGradient id="body" x1="256" y1="196" x2="256" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf0ff"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5b3b8c" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- full-bleed background (iOS masks the corners) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="140" rx="230" ry="100" fill="#ffffff" opacity="0.15"/>

  <!-- controller -->
  <g filter="url(#soft)">
    <circle cx="150" cy="324" r="52" fill="url(#body)"/>
    <circle cx="362" cy="324" r="52" fill="url(#body)"/>
    <rect x="110" y="206" width="292" height="124" rx="62" fill="url(#body)"/>
  </g>

  <!-- d-pad -->
  <g fill="#7a5cff">
    <rect x="138" y="256" width="68" height="26" rx="10"/>
    <rect x="159" y="235" width="26" height="68" rx="10"/>
  </g>

  <!-- ABXY buttons -->
  <circle cx="346" cy="246" r="17" fill="#ff5c9d"/>
  <circle cx="346" cy="296" r="17" fill="#ffcf4a"/>
  <circle cx="322" cy="271" r="17" fill="#4ad9b5"/>
  <circle cx="370" cy="271" r="17" fill="#6aa8ff"/>
</svg>
