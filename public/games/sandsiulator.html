<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌊 Sand & Fluid Simulation</title>
<script type="application/json" id="game-help">
{
  "goal": "Pure sandbox — no score, no timer. Pick a material, paint it onto the canvas and watch the physics do its thing.",
  "controls": [
    { "keys": "Click + drag", "action": "Draw the selected material" },
    { "keys": "Toolbar", "action": "Choose Sand, Water, Fire, Smoke, Stone, Oil or Erase" },
    { "keys": "Brush slider", "action": "Make the brush bigger or smaller" },
    { "keys": "Clear", "action": "Wipe the whole canvas" }
  ],
  "tips": [
    "Fire ignites Oil and Sand.",
    "Water puts out Fire.",
    "Stone stays put and blocks everything."
  ]
}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0d0d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;overflow:hidden;}
  h1{color:#fff;font-size:18px;font-weight:700;letter-spacing:2px;margin-bottom:10px;opacity:0.7;}
  #canvas-wrap{position:relative;}
  canvas{border:1px solid rgba(255,255,255,0.1);border-radius:6px;cursor:crosshair;display:block;max-width:100%;height:auto;touch-action:none;}
  #toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;}
  .tool-btn{border:2px solid transparent;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;color:#fff;background:rgba(255,255,255,0.07);}
  .tool-btn:hover{background:rgba(255,255,255,0.15);}
  .tool-btn.active{border-color:#fff;background:rgba(255,255,255,0.18);}
  #sand-btn  {border-color:#c8a040;}
  #water-btn {border-color:#2080ff;}
  #fire-btn  {border-color:#ff5500;}
  #smoke-btn {border-color:#888;}
  #stone-btn {border-color:#666;}
  #oil-btn   {border-color:#884400;}
  #erase-btn {border-color:#ff3366;}
  #clear-btn {background:rgba(255,50,50,0.15);border-color:#ff3366;color:#ff6688;}
  #size-wrap{display:flex;align-items:center;gap:8px;margin-top:8px;}
  #size-wrap label{color:rgba(255,255,255,0.5);font-size:12px;}
  #brush-size{accent-color:#00c8ff;width:100px;}
  #info{color:rgba(255,255,255,0.25);font-size:11px;margin-top:8px;letter-spacing:1px;}
</style>
</head>
<body>
<h1>🌊 SAND & FLUID SIMULATOR</h1>
<div id="canvas-wrap"><canvas id="c"></canvas></div>
<div id="toolbar">
  <button class="tool-btn active" id="sand-btn"  data-mat="sand">🟡 Sand</button>
  <button class="tool-btn"        id="water-btn" data-mat="water">💧 Water</button>
  <button class="tool-btn"        id="fire-btn"  data-mat="fire">🔥 Fire</button>
  <button class="tool-btn"        id="smoke-btn" data-mat="smoke">💨 Smoke</button>
  <button class="tool-btn"        id="stone-btn" data-mat="stone">🪨 Stone</button>
  <button class="tool-btn"        id="oil-btn"   data-mat="oil">🛢️ Oil</button>
  <button class="tool-btn"        id="erase-btn" data-mat="empty">❌ Erase</button>
  <button class="tool-btn"        id="clear-btn" id="clear-btn">🗑️ Clear</button>
</div>
<div id="size-wrap">
  <label>Brush:</label>
  <input type="range" id="brush-size" min="1" max="12" value="4"/>
  <label id="size-label">4</label>
</div>
<div id="info">Click & drag to draw  |  Fire ignites Oil & Sand  |  Water extinguishes Fire</div>

<script>
// ── Setup ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const COLS = 200, ROWS = 160, CELL = 4;
canvas.width  = COLS * CELL;
canvas.height = ROWS * CELL;

// ── Material IDs ───────────────────────────────────────────────────────────
const EMPTY = 0, SAND = 1, WATER = 2, FIRE = 3, SMOKE = 4, STONE = 5, OIL = 6;

// ── Grid (flat array, row-major) ───────────────────────────────────────────
let grid    = new Uint8Array(COLS * ROWS);
let updated = new Uint8Array(COLS * ROWS); // processed this frame?
let extra   = new Uint8Array(COLS * ROWS); // fire lifetime etc.

function idx(x,y){ return y*COLS+x; }
function get(x,y){ if(x<0||x>=COLS||y<0||y>=ROWS) return -1; return grid[idx(x,y)]; }
function set(x,y,v,e=0){ if(x<0||x>=COLS||y<0||y>=ROWS) return; grid[idx(x,y)]=v; extra[idx(x,y)]=e; }
function swap(x1,y1,x2,y2){
  const i1=idx(x1,y1),i2=idx(x2,y2);
  let t=grid[i1];grid[i1]=grid[i2];grid[i2]=t;
  t=extra[i1];extra[i1]=extra[i2];extra[i2]=t;
}

// ── Colors ─────────────────────────────────────────────────────────────────
function cellColor(mat, ex){
  switch(mat){
    case EMPTY: return null;
    case SAND:  { const v=180+((ex||0)%40)-20; return `rgb(${v},${Math.floor(v*0.78)},${Math.floor(v*0.3)})`; }
    case WATER: { const b=180+Math.floor(Math.random()*30); return `rgb(20,80,${b})`; }
    case FIRE:  { const r=200+Math.floor(Math.random()*55); const g=Math.floor(Math.random()*120); return `rgb(${r},${g},0)`; }
    case SMOKE: { const v=80+Math.floor(Math.random()*60); return `rgba(${v},${v},${v},0.7)`; }
    case STONE: return '#4a4a5a';
    case OIL:   return '#4a2800';
    default:    return '#222';
  }
}

// ── Simulation step ─────────────────────────────────────────────────────────
function step(){
  updated.fill(0);
  // Process bottom-up, left-right with random direction
  const dir = Math.random()<0.5?1:-1;

  for(let y=ROWS-1;y>=0;y--){
    const startX = dir===1?0:COLS-1;
    for(let xi=0;xi<COLS;xi++){
      const x = startX + dir*xi;
      const i = idx(x,y);
      if(updated[i]) continue;
      const mat = grid[i];

      if(mat===SAND){
        // fall down
        if(get(x,y+1)===EMPTY){ swap(x,y,x,y+1); updated[idx(x,y+1)]=1; }
        else if(get(x,y+1)===WATER){ swap(x,y,x,y+1); updated[idx(x,y+1)]=1; }
        else {
          const d=Math.random()<0.5?-1:1;
          if(get(x+d,y+1)===EMPTY||get(x+d,y+1)===WATER){ swap(x,y,x+d,y+1); updated[idx(x+d,y+1)]=1; }
          else if(get(x-d,y+1)===EMPTY||get(x-d,y+1)===WATER){ swap(x,y,x-d,y+1); updated[idx(x-d,y+1)]=1; }
        }
        // catch fire from adjacent fire
        for(let dx2=-1;dx2<=1;dx2++) for(let dy2=-1;dy2<=1;dy2++){
          if(get(x+dx2,y+dy2)===FIRE && Math.random()<0.003){ set(x,y,FIRE,30); updated[i]=1; }
        }
      }

      else if(mat===WATER){
        if(get(x,y+1)===EMPTY){ swap(x,y,x,y+1); updated[idx(x,y+1)]=1; }
        else {
          const d=Math.random()<0.5?-1:1;
          const steps=Math.floor(Math.random()*3)+1;
          let moved=false;
          for(let s=1;s<=steps;s++){
            if(get(x+d*s,y)===EMPTY){ swap(x,y,x+d*s,y); updated[idx(x+d*s,y)]=1; moved=true; break; }
            else break;
          }
          if(!moved){
            for(let s=1;s<=steps;s++){
              if(get(x-d*s,y)===EMPTY){ swap(x,y,x-d*s,y); updated[idx(x-d*s,y)]=1; break; }
              else break;
            }
          }
        }
        // extinguish adjacent fire
        for(let dx2=-1;dx2<=1;dx2++) for(let dy2=-1;dy2<=1;dy2++){
          const ni=idx(x+dx2,y+dy2);
          if(get(x+dx2,y+dy2)===FIRE){ grid[ni]=SMOKE; extra[ni]=20; }
        }
      }

      else if(mat===FIRE){
        extra[i]--;
        if(extra[i]<=0){ set(x,y,SMOKE,15); updated[i]=1; continue; }
        // rise with smoke
        if(Math.random()<0.5){
          if(get(x,y-1)===EMPTY){ set(x,y-1,FIRE,extra[i]-1); updated[idx(x,y-1)]=1; }
          else if(get(x,y-1)===SMOKE){}
        }
        // spread to oil
        for(let dx2=-1;dx2<=1;dx2++) for(let dy2=-1;dy2<=1;dy2++){
          const tx=x+dx2,ty=y+dy2,ni=idx(tx,ty);
          const tm=get(tx,ty);
          if(tm===OIL && Math.random()<0.05){ grid[ni]=FIRE; extra[ni]=60+Math.floor(Math.random()*40); }
          if(tm===SAND && Math.random()<0.001){ grid[ni]=FIRE; extra[ni]=20+Math.floor(Math.random()*20); }
        }
        // emit smoke upward
        if(Math.random()<0.15 && get(x,y-1)===EMPTY){ set(x,y-1,SMOKE,20+Math.floor(Math.random()*20)); updated[idx(x,y-1)]=1; }
        updated[i]=1;
      }

      else if(mat===SMOKE){
        extra[i]--;
        if(extra[i]<=0){ set(x,y,EMPTY); updated[i]=1; continue; }
        // drift upward
        if(get(x,y-1)===EMPTY && Math.random()<0.6){ swap(x,y,x,y-1); updated[idx(x,y-1)]=1; }
        else {
          const d=Math.random()<0.5?-1:1;
          if(get(x+d,y-1)===EMPTY && Math.random()<0.4){ swap(x,y,x+d,y-1); updated[idx(x+d,y-1)]=1; }
          else if(get(x+d,y)===EMPTY && Math.random()<0.3){ swap(x,y,x+d,y); updated[idx(x+d,y)]=1; }
        }
        updated[i]=1;
      }

      else if(mat===OIL){
        if(get(x,y+1)===EMPTY){ swap(x,y,x,y+1); updated[idx(x,y+1)]=1; }
        else if(get(x,y+1)===WATER){ /* oil floats — don't sink into water */ }
        else {
          const d=Math.random()<0.5?-1:1;
          for(let s=1;s<=2;s++){
            if(get(x+d*s,y)===EMPTY){ swap(x,y,x+d*s,y); updated[idx(x+d*s,y)]=1; break; }
            else break;
          }
        }
        // catch fire
        for(let dx2=-1;dx2<=1;dx2++) for(let dy2=-1;dy2<=1;dy2++){
          if(get(x+dx2,y+dy2)===FIRE && Math.random()<0.04){ set(x,y,FIRE,60); updated[i]=1; }
        }
      }
      // STONE: static, does nothing
    }
  }
}

// ── Render ─────────────────────────────────────────────────────────────────
const imageData = ctx.createImageData(canvas.width, canvas.height);
const pixels    = imageData.data;

// Precomputed color palettes for speed
function fastColor(mat, ex, px){
  switch(mat){
    case EMPTY: pixels[px]=13;pixels[px+1]=13;pixels[px+2]=26;pixels[px+3]=255; return;
    case SAND:{
      const v=160+(ex%40);
      pixels[px]=v;pixels[px+1]=Math.floor(v*0.75);pixels[px+2]=Math.floor(v*0.25);pixels[px+3]=255; return;
    }
    case WATER:{
      const jit=Math.random()*20|0;
      pixels[px]=20;pixels[px+1]=80+jit;pixels[px+2]=180+jit;pixels[px+3]=220; return;
    }
    case FIRE:{
      const r=200+(Math.random()*55|0);const g=Math.random()*120|0;
      pixels[px]=r;pixels[px+1]=g;pixels[px+2]=0;pixels[px+3]=255; return;
    }
    case SMOKE:{
      const v=80+(Math.random()*60|0);
      pixels[px]=v;pixels[px+1]=v;pixels[px+2]=v;pixels[px+3]=180; return;
    }
    case STONE:
      pixels[px]=74;pixels[px+1]=74;pixels[px+2]=90;pixels[px+3]=255; return;
    case OIL:
      pixels[px]=74;pixels[px+1]=40;pixels[px+2]=0;pixels[px+3]=255; return;
    default:
      pixels[px]=0;pixels[px+1]=0;pixels[px+2]=0;pixels[px+3]=255;
  }
}

function render(){
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const mat=grid[idx(x,y)];
      const ex=extra[idx(x,y)];
      // Each cell is CELL×CELL pixels
      for(let py=0;py<CELL;py++){
        for(let px2=0;px2<CELL;px2++){
          const pi=((y*CELL+py)*canvas.width+(x*CELL+px2))*4;
          fastColor(mat,ex,pi);
        }
      }
    }
  }
  ctx.putImageData(imageData,0,0);
}

// ── Input ──────────────────────────────────────────────────────────────────
let currentMat = SAND;
let brushSize  = 4;
let isDrawing  = false;

document.querySelectorAll('.tool-btn[data-mat]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const m = btn.dataset.mat;
    currentMat = {sand:SAND,water:WATER,fire:FIRE,smoke:SMOKE,stone:STONE,oil:OIL,empty:EMPTY}[m]??EMPTY;
  });
});

document.getElementById('clear-btn').addEventListener('click',()=>{
  grid.fill(0); extra.fill(0);
});

const brushEl = document.getElementById('brush-size');
const sizeLabel= document.getElementById('size-label');
brushEl.addEventListener('input',()=>{ brushSize=+brushEl.value; sizeLabel.textContent=brushSize; });

function canvasPos(e){
  const rect=canvas.getBoundingClientRect();
  const scaleX=COLS/rect.width, scaleY=ROWS/rect.height;
  const cx=(e.clientX-rect.left)*scaleX|0;
  const cy=(e.clientY-rect.top)*scaleY|0;
  return [cx,cy];
}

function paint(e){
  const [cx,cy]=canvasPos(e);
  const r=brushSize;
  for(let dy=-r;dy<=r;dy++){
    for(let dx=-r;dx<=r;dx++){
      if(dx*dx+dy*dy<=r*r){
        const tx=cx+dx,ty=cy+dy;
        if(tx>=0&&tx<COLS&&ty>=0&&ty<ROWS){
          const m=currentMat;
          let ex=0;
          if(m===FIRE) ex=40+Math.floor(Math.random()*30);
          if(m===SMOKE) ex=20+Math.floor(Math.random()*20);
          if(m===SAND) ex=Math.floor(Math.random()*40);
          set(tx,ty,m,ex);
        }
      }
    }
  }
}

canvas.addEventListener('mousedown',e=>{ isDrawing=true; paint(e); });
canvas.addEventListener('mousemove',e=>{ if(isDrawing) paint(e); });
canvas.addEventListener('mouseup',  ()=>{ isDrawing=false; });
canvas.addEventListener('mouseleave',()=>{ isDrawing=false; });

canvas.addEventListener('touchstart',e=>{ e.preventDefault(); isDrawing=true; paint(e.touches[0]); },{passive:false});
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); if(isDrawing) paint(e.touches[0]); },{passive:false});
canvas.addEventListener('touchend',  ()=>{ isDrawing=false; });

// ── Game Loop ──────────────────────────────────────────────────────────────
let frameCount=0;
function loop(){
  requestAnimationFrame(loop);
  step();
  if(frameCount%2===0) render(); // render every 2 sim steps for performance
  frameCount++;
}

loop();
</script>
</body>
</html>
